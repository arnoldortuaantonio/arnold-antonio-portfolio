    <circle cx="200" cy="52" r="1.8" fill="url(#spark)"/>
    <circle cx="214" cy="122" r="2.2" fill="url(#spark)"/>
    <circle cx="38" cy="162" r="2" fill="url(#spark)"/>
    <circle cx="54" cy="198" r="2.1" fill="url(#spark)"/>
    <circle cx="194" cy="198" r="2.1" fill="url(#spark)"/>
    <circle cx="214" cy="170" r="1.8" fill="url(#spark)"/>
    <circle cx="172" cy="214" r="1.8" fill="url(#spark)"/>
  </g>

