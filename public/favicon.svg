    <path d="M41 188C93 220 170 216 230 168" fill="none" stroke="url(#ring)" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
    <path d="M20 126C82 126 100 90 132 72C165 54 195 58 235 72" fill="none" stroke="url(#ring)" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
  </g>

  <g>
    <path d="M40 187V86h38c28 0 43 14 43 35 0 21-15 35-43 35H40zm31-18h6c12 0 20-5 20-17 0-12-8-17-20-17h-6v34z" fill="url(#textFill)" stroke="url(#blueEdge)" stroke-width="2.2"/>
    <path d="M122 87h-19v100h19V87z" fill="url(#textFill)" stroke="url(#blueEdge)" stroke-width="2.2"/>
    <path d="M192 187V86h-25l-22 25v18l18-19h12v77h17z" fill="url(#textFill)" stroke="url(#blueEdge)" stroke-width="2.2"/>
