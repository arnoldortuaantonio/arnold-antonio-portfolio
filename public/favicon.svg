<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="AOA favicon">
  <defs>
    <linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#050d1f"/>
      <stop offset="50%" stop-color="#061a38"/>
      <stop offset="100%" stop-color="#020814"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%" stop-color="#1deaff"/>
      <stop offset="35%" stop-color="#7ad6ff"/>
      <stop offset="60%" stop-color="#90dfff"/>
      <stop offset="100%" stop-color="#0a4dff"/>
    </linearGradient>
    <linearGradient id="textFill" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#f3f8ff"/>
      <stop offset="25%" stop-color="#ecf5ff"/>
      <stop offset="58%" stop-color="#dfeefd"/>
      <stop offset="100%" stop-color="#9ccaf7"/>
    </linearGradient>
    <linearGradient id="blueEdge" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%" stop-color="#49d3ff"/>
      <stop offset="100%" stop-color="#0d5ee8"/>
    </linearGradient>
    <radialGradient id="spark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#dff7ff"/>
      <stop offset="100%" stop-color="#8ad8ff"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <rect x="16" y="16" width="224" height="224" rx="42" fill="none" stroke="rgba(255,255,255,0.12)"/>

  <g opacity="0.7">
